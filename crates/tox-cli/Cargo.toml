[package]
name = "tox-cli"
description = "Command-line client for development, integration testing and smoke tests"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tox-cli"
path = "src/main.rs"

[dependencies]
tox-core = { path = "../tox-core" }
tox-social = { path = "../tox-social" }
tox-store = { path = "../tox-store" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
