[package]
name = "toxsocial-desktop"
description = "ToxSocial desktop client — decentralized social network on the Tox protocol"
version = "0.2.29"
edition = "2021"
license.workspace = true
default-run = "toxsocial-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
reqwest = { version = "0.13", features = ["json", "multipart"] }
url = "2"
tox-core = { path = "../../crates/tox-core" }
tox-social = { path = "../../crates/tox-social" }
tox-store = { path = "../../crates/tox-store" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[lib]
name = "toxsocial_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
